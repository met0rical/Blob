services:
  blob-scorer:
    build: .
    ports:
      - "8082:3000"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    volumes:
      - blob-data:/data
    restart: unless-stopped
volumes:
  blob-data:
